<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#06030d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Polyarena</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/bungee.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/teko.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="tb-left">
        <div id="logo">POLY<span>ARENA</span></div>
        <div id="matchBanner"></div>
      </div>
      <div id="rail"></div>
      <div class="tb-right">
        <button id="rebuyBtn" hidden>REBUY</button>
        <div id="bankChip"><span class="coin"></span><b id="bankroll">$1,000</b></div>
        <button id="installBtn" class="icon-btn" hidden title="Install app">⬇</button>
        <button id="soundBtn" class="icon-btn" title="Sound">🔊</button>
      </div>
    </header>

    <main id="stage">
      <canvas id="arenaCanvas"></canvas>
      <div id="lobbyShade"></div>

      <!-- in-fight HUD -->
      <div id="fightHud" class="hidden">
        <div id="hpA" class="hpbox side-A">
          <div class="hp-name"></div>
          <div class="hp-bar"><div class="hp-trail"></div><div class="hp-fill"></div><div class="hp-shine"></div></div>
          <div class="hp-sub"></div>
        </div>
        <div id="timerBox">
          <div id="roundLabel">ROUND 1</div>
          <div id="clock">30</div>
          <div id="roundPips"><i></i><i></i><i></i></div>
        </div>
        <div id="hpB" class="hpbox side-B">
          <div class="hp-name"></div>
          <div class="hp-bar"><div class="hp-trail"></div><div class="hp-fill"></div><div class="hp-shine"></div></div>
          <div class="hp-sub"></div>
        </div>
      </div>
      <div id="strikeMeter" class="hidden"></div>
      <div id="comboA" class="combo side-A"></div>
      <div id="comboB" class="combo side-B"></div>
      <div id="specialBanner"></div>

      <!-- live prop huddles -->
      <div id="huddleL" class="huddle"></div>
      <div id="huddleR" class="huddle"></div>

      <!-- tale of the tape -->
      <div id="tape"></div>

      <!-- big center announcements -->
      <div id="announce"></div>

      <!-- betting table -->
      <div id="table"></div>

      <!-- countdown + fight-now -->
      <div id="betDock">
        <div id="countdown">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle class="cd-track" cx="32" cy="32" r="27"></circle>
            <circle class="cd-ring" cx="32" cy="32" r="27"></circle>
          </svg>
          <div class="cd-num">30</div>
        </div>
        <div class="cd-text">
          <div class="cd-label">BETS CLOSE IN</div>
          <button id="skipBtn">FIGHT NOW ▶</button>
        </div>
      </div>

      <!-- chip tray -->
      <div id="chipTray"></div>

      <!-- bet slip -->
      <aside id="betslip">
        <button id="slipToggle">MY BETS <span id="slipCount" class="pill">0</span></button>
        <div id="slipList"></div>
      </aside>

      <div id="toasts"></div>
      <canvas id="fxCanvas"></canvas>
      <div id="urgency"></div>
      <div id="resultOverlay"></div>
    </main>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
