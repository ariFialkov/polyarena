# Deploy Polyarena to GitHub Pages.
# The game is a static, build-free site, so this just uploads the repo as-is.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/polyarena-betting-game-w44sit
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that's mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on automatically if it isn't already. Requires the repo
          # to allow it; if this fails, enable it once by hand under
          # Settings -> Pages -> Source: GitHub Actions.
          enablement: true

      - name: Stage site files
        run: |
          mkdir -p _site
          # Copy everything except repo plumbing and dev-only files.
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '_site'
          # Skip Jekyll processing; serve files verbatim.
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
