<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b34"/>
      <stop offset="1" stop-color="#0b0d16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd75e"/>
      <stop offset="1" stop-color="#e8a828"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#2c3260" stroke-width="14"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#gold)" stroke-width="14"
          stroke-dasharray="180 900" stroke-linecap="round" transform="rotate(-50 256 256)"/>
  <!-- crossed gloves -->
  <g transform="translate(256 262)">
    <g transform="rotate(-25)">
      <rect x="-34" y="-86" width="52" height="66" rx="24" fill="#ff5a5a"/>
      <rect x="-14" y="-30" width="24" height="34" rx="10" fill="#b3202a"/>
    </g>
    <g transform="rotate(25)">
      <rect x="-18" y="-86" width="52" height="66" rx="24" fill="#6f9dff"/>
      <rect x="-10" y="-30" width="24" height="34" rx="10" fill="#2b3aa0"/>
    </g>
  </g>
  <!-- chip -->
  <circle cx="256" cy="356" r="54" fill="url(#gold)" stroke="#3a2800" stroke-width="6"/>
  <circle cx="256" cy="356" r="38" fill="none" stroke="#3a2800" stroke-width="5" stroke-dasharray="16 12"/>
  <text x="256" y="368" font-family="Arial Black, sans-serif" font-size="34" font-weight="900"
        text-anchor="middle" fill="#3a2800">PA</text>
</svg>
